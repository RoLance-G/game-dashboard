/* Desktop industrial naval UI theme */
:root{
  --bg:#d6d4cf;--panel:#f4f2ed;--text:#292929;--muted:#77736d;--line:#99958e;
  --primary:#e88a21;--soft:#fff0dc;--danger:#c94c46;--shadow:0 2px 4px rgba(28,28,28,.24),inset 0 1px 0 rgba(255,255,255,.9);--r:7px;
}
html{min-width:1100px;background:#c7c4be}
body{min-width:1100px;font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;background:
 linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0) 130px),
 repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 4px),var(--bg);font-weight:600}
button,input,select,textarea{font-family:inherit}
.app{max-width:1480px;padding:18px 24px 44px}
.topbar{min-height:58px;margin-bottom:14px;padding:0 4px;border-bottom:3px solid #8b8780;position:relative}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid rgba(255,255,255,.8)}
.brand h1{font-size:30px;letter-spacing:.5px;font-weight:900;color:#252525;text-shadow:0 1px 0 #fff}
.brand p{display:none!important}
.actions{gap:8px}
.btn,.add-game{border:1px solid #97928a;border-radius:6px;background:linear-gradient(#fff,#e7e4de);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.25);color:#333;font-weight:800;letter-spacing:.1px}
.btn:hover,.add-game:hover{background:linear-gradient(#fff8ee,#f0dfc9);border-color:#c87b25}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.btn.primary{background:linear-gradient(#f5a444,#df7818);border-color:#b65d12;color:white;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.btn.danger{color:#ad332f}
.layout{grid-template-columns:286px minmax(0,1fr);gap:16px}
.sidebar,.update-card,.settings-shell,.metric,.toolbar,.empty{border:1px solid #8f8b84;border-radius:7px;box-shadow:var(--shadow);background:linear-gradient(135deg,#faf9f6,#e9e6df)}
.sidebar{padding:10px;top:14px}
.side-head{margin:1px 3px 8px;padding:8px 9px;color:#4a4844;border-bottom:1px solid #aaa59d;font-size:14px;letter-spacing:.5px}
.game-list{gap:5px}
.game-row{display:grid;grid-template-columns:20px minmax(0,1fr) 31px;gap:4px;align-items:center;border:1px solid #aaa69f;border-radius:6px;background:linear-gradient(#fdfdfc,#dedbd5);box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,.15);transition:.12s}
.game-row.all-game{grid-template-columns:minmax(0,1fr);margin-bottom:5px;border-color:#8e8981}
.game-row.dragging{opacity:.42}
.game-row.drag-over{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary),0 1px 2px rgba(0,0,0,.2)}
.game-drag{display:flex;align-items:center;justify-content:center;font-size:17px;color:#77736c;cursor:grab;user-select:none}
.game-drag:active{cursor:grabbing}
.game-btn{min-height:44px;border-radius:4px;padding:8px 10px;font-size:15px;font-weight:850;color:#333}
.game-btn.active{background:linear-gradient(90deg,#fff0dc,#f3dfc7);color:#b95e0d;box-shadow:inset 4px 0 0 var(--primary)}
.game-btn:hover{background:#f5eee4;color:#a9570d}
.game-menu{justify-content:center}
.iconbtn{border-radius:4px;color:#5e5a54;font-weight:900}
.iconbtn:hover{background:#f1d9bb;color:#9b4d0a}
.count{border-radius:4px;background:#d3d0ca;border:1px solid #aaa69f;color:#4f4c47;font-weight:800;padding:2px 7px}
.side-actions{border-top:1px solid #aaa59d;padding-top:10px}
.add-game{border-style:dashed;padding:10px}
.metrics{gap:10px;margin-bottom:12px}
.metric{padding:13px 16px;background:linear-gradient(#faf9f6,#e5e2dc)}
.metric .label{color:#68645e;font-weight:800;letter-spacing:.4px}
.metric .value{font-size:27px;margin-top:4px;font-weight:900;color:#2f2e2b}
.toolbar{padding:9px;margin-bottom:12px;border-radius:7px}
.input,.select,.field input,.field select,.field textarea{border:1px solid #9b968e!important;border-radius:5px!important;background:#fffefb!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);font-weight:650;color:#30302e}
.section-head{margin:0 4px 7px;padding:0 2px}
.section-head h2{font-size:19px;font-weight:900;text-shadow:0 1px 0 #fff}
.update-card{margin-bottom:10px}
.update-head{padding:12px 14px;border-bottom:1px solid #97928b;background:linear-gradient(#efede8,#d6d2ca);box-shadow:inset 0 1px 0 #fff}
.update-title{font-size:16px;font-weight:900;letter-spacing:.2px}
.update-meta{color:#6e6a64;font-weight:700}
.tasks{padding:3px 7px 6px;background:#f7f5f0}
.task{min-height:43px;border-radius:4px;padding:7px 8px;border-bottom:1px solid #d4d0c8}
.task:last-child{border-bottom:0}
.task:hover{background:#fff0dc}
.task-check{width:18px;height:18px;accent-color:var(--primary)}
.task-name{font-weight:800;color:#333}
.tag{min-width:110px;text-align:center;border-radius:4px;border:1px solid #aaa59e;background:linear-gradient(#eeece7,#d7d3cc);color:#44413d;font-size:13px;font-weight:850;padding:4px 9px;box-shadow:inset 0 1px 0 #fff}
.settings-shell{grid-template-columns:250px minmax(0,1fr)}
.settings-games{border-right:1px solid #928e87;background:#ddd9d2;padding:10px}
.settings-main{padding:17px;background:#f5f3ee}
.settings-title h2{font-weight:900}
.category-row{border-top:1px solid #bbb6ad;padding:8px 4px}
.drag{font-size:18px;color:#65615b}
.modal-backdrop{background:rgba(25,24,22,.55)}
.modal{border-radius:8px;border:2px solid #76726c;background:#f2f0eb;box-shadow:0 12px 38px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.modal h3{padding-bottom:10px;border-bottom:2px solid #aaa59d;font-size:20px;font-weight:900}
.toast{border-radius:5px;background:#33312e;border:1px solid #111;font-weight:750}
@media(max-width:820px), (max-width:560px){html,body{min-width:1100px}.app{padding:18px 24px 44px}.layout{grid-template-columns:286px minmax(0,1fr)}.sidebar{position:sticky}.metrics{grid-template-columns:repeat(3,1fr)}.settings-shell{grid-template-columns:250px minmax(0,1fr)}.form-grid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}.topbar{display:flex}.actions{margin-top:0}.update-head{display:flex}.update-actions{margin-top:0}.task{grid-template-columns:auto minmax(0,1fr) auto auto}.task-main{display:flex}.tag{margin-top:0;display:inline-block}.batch-head{display:grid}.batch-row{grid-template-columns:220px minmax(0,1fr) auto}.category-row{grid-template-columns:auto minmax(0,1fr) auto auto auto auto}}


/* Bright, lighthearted desktop game-home theme */
:root{
  --bg:#f5efec;
  --panel:rgba(255,255,255,.91);
  --text:#34353b;
  --muted:#86848b;
  --line:#d8d3d4;
  --primary:#f39a48;
  --soft:#fff1e5;
  --danger:#e46970;
  --shadow:0 7px 22px rgba(98,84,88,.12),inset 0 1px 0 rgba(255,255,255,.96);
  --r:14px;
}
html{
  min-width:1180px;
  background:#f4eeeb;
}
body{
  min-width:1180px;
  color:var(--text);
  font-family:"Microsoft YaHei UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-weight:500;
  background:
    radial-gradient(circle at 15% 4%,rgba(255,206,215,.58),transparent 25%),
    radial-gradient(circle at 87% 10%,rgba(198,229,255,.63),transparent 26%),
    radial-gradient(circle at 68% 92%,rgba(255,229,183,.42),transparent 27%),
    linear-gradient(135deg,#faf7f4 0%,#f4eeed 48%,#eef5f9 100%);
  background-attachment:fixed;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    linear-gradient(120deg,transparent 0 48%,rgba(255,255,255,.44) 49% 50%,transparent 51%),
    radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.5px);
  background-size:320px 320px,28px 28px;
  mask-image:linear-gradient(to bottom,black,transparent 72%);
}
.app{
  position:relative;
  z-index:1;
  max-width:1540px;
  padding:18px 28px 48px;
}
.topbar{
  min-height:70px;
  padding:0 6px 12px;
  margin-bottom:16px;
  border-bottom:1px solid rgba(169,158,162,.56);
}
.topbar:after{
  bottom:-4px;
  border-bottom-color:rgba(255,255,255,.95);
}
.brand h1{
  font-size:32px;
  font-weight:850;
  letter-spacing:.3px;
  color:#3d3b42;
  text-shadow:0 1px 0 white;
}
.actions{gap:9px}
.btn,.add-game{
  border:1px solid #d0c8ca;
  border-radius:11px;
  color:#4b494f;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(247,241,241,.94));
  box-shadow:0 3px 9px rgba(102,88,92,.1),inset 0 1px 0 white;
  font-weight:700;
}
.btn:hover,.add-game:hover{
  border-color:#efa465;
  background:linear-gradient(180deg,#fff,#fff3e9);
  color:#b76524;
  transform:translateY(-1px);
}
.btn:active{
  transform:translateY(0);
  box-shadow:inset 0 2px 5px rgba(100,80,86,.12);
}
.btn.primary{
  border-color:#e68a3e;
  color:white;
  text-shadow:0 1px 1px rgba(131,74,24,.25);
  background:linear-gradient(180deg,#ffb769,#ef9141);
  box-shadow:0 5px 13px rgba(232,133,54,.24),inset 0 1px 0 rgba(255,255,255,.48);
}
.btn.danger{color:#d85f66}
.layout{
  grid-template-columns:286px minmax(0,1fr);
  gap:18px;
}
.sidebar,.update-card,.settings-shell,.metric,.toolbar,.empty{
  border:1px solid rgba(196,186,188,.72);
  border-radius:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(249,245,245,.87));
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}
.sidebar{
  padding:12px;
  top:14px;
}
.side-head{
  margin:0 4px 10px;
  padding:9px 8px 11px;
  color:#6d686d;
  border-bottom:1px solid #e0d9db;
  font-size:13px;
  letter-spacing:.4px;
}
.game-list{gap:7px}
.game-row{
  grid-template-columns:22px minmax(0,1fr) 34px;
  gap:5px;
  min-height:48px;
  border:1px solid #ddd6d8;
  border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,242,243,.94));
  box-shadow:0 3px 10px rgba(105,91,95,.08),inset 0 1px 0 white;
}
.game-row.all-game{
  grid-template-columns:minmax(0,1fr);
  border-color:#d6cccf;
}
.game-row.drag-over{
  border-color:#f0a064;
  box-shadow:inset 4px 0 0 #f29c58,0 5px 13px rgba(217,137,76,.12);
}
.game-drag{
  color:#aaa1a5;
  font-size:18px;
}
.game-btn{
  min-height:46px;
  padding:8px 10px;
  color:#4c4a50;
  font-size:15px;
  font-weight:700;
}
.game-btn.active{
  color:#b96528;
  background:linear-gradient(90deg,#fff4ea,#fff9f4);
  box-shadow:inset 4px 0 0 #f49b4d;
}
.game-btn:hover{
  color:#ae622d;
  background:#fff6ef;
}
.iconbtn{
  color:#8d868a;
  border-radius:9px;
}
.iconbtn:hover{
  color:#bd6a30;
  background:#fff0e4;
}
.count{
  color:#747077;
  border:1px solid #ddd5d7;
  border-radius:999px;
  background:#f4eff0;
}
.side-actions{
  border-top:1px solid #e2dadd;
  padding-top:11px;
}
.add-game{
  border-style:dashed;
  color:#8b8589;
}
.metrics{
  gap:12px;
  margin-bottom:14px;
}
.metric{
  position:relative;
  overflow:hidden;
  padding:15px 18px;
}
.metric:after{
  content:"";
  position:absolute;
  right:-18px;
  top:-26px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,195,156,.27),transparent 69%);
}
.metric:nth-child(2):after{background:radial-gradient(circle,rgba(173,218,255,.30),transparent 69%)}
.metric:nth-child(3):after{background:radial-gradient(circle,rgba(255,191,207,.28),transparent 69%)}
.metric .label{
  color:#898389;
  font-size:13px;
  font-weight:650;
}
.metric .value{
  position:relative;
  z-index:1;
  color:#48454b;
  font-size:28px;
  font-weight:820;
}
.toolbar{
  gap:10px;
  padding:13px;
  margin-bottom:16px;
}
.input,.select,
.field input,.field select,.field textarea,
.batch-row input,.batch-row select{
  border:1px solid #d9d1d4;
  border-radius:10px;
  color:#4b494f;
  background:rgba(255,255,255,.88);
  box-shadow:inset 0 1px 3px rgba(101,85,90,.05);
}
.input:focus,.select:focus,
.field input:focus,.field select:focus,.field textarea:focus,
.batch-row input:focus,.batch-row select:focus{
  outline:2px solid rgba(242,153,78,.25);
  border-color:#efa15f;

function renderGames(){let games=[{id:'all',name:'全部游戏'},...state.games];$('#gameTotal').textContent=state.games.length+' 款';$('#gameList').innerHTML=games.map(g=>{let n=state.items.filter(i=>(g.id==='all'||i.game===g.id)&&!i.done).length;return `<div class="game-row ${g.id==='all'?'all-game':''}" ${g.id==='all'?'':`draggable="true" data-game-id="${g.id}"`} >${g.id==='all'?'':`<span class="game-drag drag" title="拖拽排序">⠿</span>`}<button class="game-btn ${selectedGame===g.id?'active':''}" data-game="${g.id}"><span>${esc(g.name)}</span><span class="count">${n}</span></button>${g.id==='all'?'':`<div class="game-menu"><button class="iconbtn rename-game" data-id="${g.id}" title="重命名">✎</button></div>`}</div>`}).join('');$$('.game-btn').forEach(b=>b.onclick=()=>{selectedGame=b.dataset.game;render()});$$('.rename-game').forEach(b=>b.onclick=e=>{e.stopPropagation();renameGame(b.dataset.id)});let dragId=null;$$('.game-row[draggable=true]').forEach(r=>{r.ondragstart=e=>{dragId=r.dataset.gameId;r.classList.add('dragging');e.dataTransfer.effectAllowed='move'};r.ondragend=()=>{$$('.game-row').forEach(x=>x.classList.remove('dragging','drag-over'));dragId=null};r.ondragover=e=>{e.preventDefault();if(r.dataset.gameId!==dragId)r.classList.add('drag-over')};r.ondragleave=()=>r.classList.remove('drag-over');r.ondrop=e=>{e.preventDefault();r.classList.remove('drag-over');if(!dragId||dragId===r.dataset.gameId)return;let from=state.games.findIndex(g=>g.id===dragId),to=state.games.findIndex(g=>g.id===r.dataset.gameId);if(from<0||to<0)return;let [moved]=state.games.splice(from,1);state.games.splice(to,0,moved);save();render()}})}
function moveGame(id,d){let i=state.games.findIndex(g=>g.id===id),j=i+d;if(j<0||j>=state.games.length)return;[state.games[i],state.games[j]]=[state.games[j],state.games[i]];save();render()}function renameGame(id){let g=gameById(id);openModal(`<h3>修改游戏名称</h3><div class="field"><label>游戏名称</label><input id="renameGameInput" value="${esc(g.name)}"></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveGameName">保存</button></div>`);$('#saveGameName').onclick=()=>{let v=$('#renameGameInput').value.trim();if(!v)return;g.name=v;save();closeModal();render();toast('游戏名称已更新')}}
function filtered(){let st=$('#statusFilter').value,ar=$('#archiveFilter').value,q=$('#searchInput').value.trim().toLowerCase();return state.items.filter(i=>{let u=updateById(i.updateId),arch=!!u?.archived;return(selectedGame==='all'||i.game===selectedGame)&&(st==='all'||(st==='done'?i.done:!i.done))&&(ar==='all'||(ar==='archived'?arch:!arch))&&(!q||(i.name+' '+i.category).toLowerCase().includes(q))})}
function renderMain(){let scope=state.items.filter(i=>selectedGame==='all'||i.game===selectedGame),done=scope.filter(i=>i.done).length;$('#pendingCount').textContent=scope.filter(i=>!i.done).length;$('#updateCount').textContent=state.updates.filter(u=>!u.archived&&(selectedGame==='all'||u.game===selectedGame)).length;$('#completionRate').textContent=scope.length?Math.round(done/scope.length*100)+'%':'0%';let list=filtered();if(!list.length){$('#mainContent').innerHTML='<div class="empty">没有符合当前筛选条件的内容。</div>';return}let html='';for(const g of state.games){let items=list.filter(i=>i.game===g.id);if(!items.length)continue;html+=`<section class="section"><div class="section-head"><h2>${esc(g.name)}</h2><small>${items.filter(i=>!i.done).length} 项未完成</small></div>`;let order=[...state.updates.filter(u=>u.game===g.id).map(u=>u.id),''];for(const uid of order){let tasks=items.filter(i=>i.updateId===uid);if(!tasks.length)continue;let categoryOrder=g.categories||[];tasks.sort((a,b)=>{let ai=categoryOrder.indexOf(a.category),bi=categoryOrder.indexOf(b.category);ai=ai<0?categoryOrder.length:ai;bi=bi<0?categoryOrder.length:bi;return ai-bi});let u=uid?updateById(uid):null,doneN=tasks.filter(i=>i.done).length;html+=`<div class="update-card ${u?.archived?'archived':''}"><div class="update-head"><div><div class="update-title">${esc(u?.name||'未分组待办')}</div>${u?`<div class="update-meta">${esc(u.date||'无日期')} · ${u.archived?'已归档':'活跃'}</div>`:''}</div><div class="update-actions">${u?`<button class="btn small rename-update" data-id="${u.id}">重命名</button><button class="btn small archive-update" data-id="${u.id}">${u.archived?'恢复':'Archive'}</button>`:''}</div></div><div class="tasks">${tasks.map(i=>`<div class="task ${i.done?'done':''}"><input class="task-check" type="checkbox" data-id="${i.id}" ${i.done?'checked':''}><span class="tag">${esc(i.category)}</span><span class="task-name">${esc(i.name)}</span><button class="iconbtn edit-task" data-id="${i.id}" title="编辑">✎</button><button class="iconbtn delete-task" data-id="${i.id}" title="删除">🗑</button></div>`).join('')}</div></div>`}html+='</section>'}$('#mainContent').innerHTML=html;$$('.task-check').forEach(c=>c.onchange=()=>{let i=state.items.find(x=>x.id===c.dataset.id);i.done=c.checked;save();render()});$$('.rename-update').forEach(b=>b.onclick=()=>editUpdate(b.dataset.id));$$('.archive-update').forEach(b=>b.onclick=()=>{let u=updateById(b.dataset.id),n=state.items.filter(i=>i.updateId===u.id&&!i.done).length;if(!u.archived&&n&&!confirm(`这一组还有 ${n} 项未完成，仍然归档吗？`))return;u.archived=!u.archived;save();render()});$$('.edit-task').forEach(b=>b.onclick=()=>editTask(b.dataset.id));$$('.delete-task').forEach(b=>b.onclick=()=>{if(!confirm('确定删除这条待办吗？'))return;state.items=state.items.filter(i=>i.id!==b.dataset.id);save();render();toast('待办已删除')})}

      : `<div class="quicklinks-empty">这个游戏还没有添加常用网站。<br><button class="btn small" id="addFirstSite">＋ 添加网站</button></div>`

function editUpdate(id){let u=updateById(id);if(!u)return;openModal(`<h3>重命名更新</h3><div class="field"><label>更新名称</label><input id="renameUpdateName" value="${esc(u.name)}"></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveUpdateName">保存</button></div>`);$('#saveUpdateName').onclick=()=>{let name=$('#renameUpdateName').value.trim();if(!name)return;u.name=name;save();closeModal();currentPage==='settings'?renderSettings():render();toast('更新名称已修改')}}
let settingsSection='categories';

function renderSettings(){
  let g=gameById(settingsGame)||state.games[0];
  if(!g){
    $('#settingsGameList').innerHTML='';
    $('#settingsContent').innerHTML='<div class="empty">请先添加一个游戏。</div>';
    return;
  }
  settingsGame=g.id;

  $('#settingsGameList').innerHTML=
    `<div class="settings-side-title">选择游戏</div>`+
    state.games.map(x=>`<button class="game-btn ${x.id===g.id?'active':''}" data-id="${x.id}">${esc(x.name)}</button>`).join('');

  $$('#settingsGameList .game-btn').forEach(b=>b.onclick=()=>{
    settingsGame=b.dataset.id;
    renderSettings();
  });

  $('#settingsContent').innerHTML=`
    <div class="settings-title">
      <div>
        <h2 style="margin:0">${esc(g.name)}</h2>
        <div style="color:var(--muted);font-size:13px;margin-top:4px">管理当前游戏的类别和更新版本</div>
      </div>
    </div>
    <div class="settings-tabs">
      <button class="settings-tab ${settingsSection==='categories'?'active':''}" data-section="categories">类别列表</button>
      <button class="settings-tab ${settingsSection==='updates'?'active':''}" data-section="updates">更新版本</button>
      <button class="settings-tab ${settingsSection==='links'?'active':''}" data-section="links">常用网站</button>
    </div>
    <div id="settingsPanel"></div>
  `;

  $$('.settings-tab').forEach(b=>b.onclick=()=>{
    settingsSection=b.dataset.section;
    renderSettings();
  });

  if(settingsSection==='updates'){
    renderGameUpdateManager(g);
  }else if(settingsSection==='links'){
    renderGameLinksManager(g);
  }else{
    renderGameCategoryManager(g);
  }
}

      <div>

      </div>

    </div>
    <div id="categoryList">
      ${g.categories.map((c,i)=>`
        <div class="category-row" draggable="true" data-index="${i}">
          <span class="drag">⋮⋮</span>
          <span>${esc(c)}</span>
          <button class="btn small cat-up" data-i="${i}">↑</button>
          <button class="btn small cat-down" data-i="${i}">↓</button>
          <button class="btn small rename-cat" data-i="${i}">重命名</button>
          <button class="btn small danger delete-cat" data-i="${i}">删除</button>
        </div>
      `).join('')}
    </div>
  `;

  $('#addCategory').onclick=()=>editCategory(g.id);
  $$('.rename-cat').forEach(b=>b.onclick=()=>editCategory(g.id,+b.dataset.i));
  $$('.delete-cat').forEach(b=>b.onclick=()=>deleteCategory(g.id,+b.dataset.i));
  $$('.cat-up').forEach(b=>b.onclick=()=>moveCategory(g.id,+b.dataset.i,-1));
  $$('.cat-down').forEach(b=>b.onclick=()=>moveCategory(g.id,+b.dataset.i,1));

  let dragFrom=null;
  $$('.category-row').forEach(r=>{
    r.ondragstart=()=>dragFrom=+r.dataset.index;
    r.ondragover=e=>e.preventDefault();
    r.ondrop=()=>{
      const to=+r.dataset.index;
      if(dragFrom===null||dragFrom===to)return;
      const [x]=g.categories.splice(dragFrom,1);
      g.categories.splice(to,0,x);
      save();
      renderSettings();
    };
  });
}

function renderGameUpdateManager(g){
  const updates=state.updates.filter(u=>u.game===g.id);
  const rows=updates.map((u,i)=>{
    const taskCount=state.items.filter(item=>item.updateId===u.id).length;
    const pendingCount=state.items.filter(item=>item.updateId===u.id&&!item.done).length;
    return `<div class="update-manager-row ${u.archived?'is-archived':''}" draggable="true" data-update-id="${u.id}" data-index="${i}">
      <span class="drag update-manager-drag" title="拖拽排序">⋮⋮</span>
      <div class="update-manager-info">
        <div class="update-manager-name">${esc(u.name)}</div>
        <div class="update-manager-meta">${u.date?esc(u.date):'无日期'} · ${taskCount} 项${pendingCount?`，${pendingCount} 项未完成`:''}</div>
      </div>
      <span class="update-status ${u.archived?'archived':'active'}">${u.archived?'已归档':'活跃'}</span>
      <button class="btn small manage-rename-update" data-id="${u.id}">重命名</button>
      <button class="btn small manage-archive-update" data-id="${u.id}">${u.archived?'恢复':'Archive'}</button>
      <button class="btn small danger manage-delete-update" data-id="${u.id}">删除</button>
    </div>`;
  }).join('');

  $('#settingsPanel').innerHTML=`
    <div class="settings-panel-head">
      <div>
        <h3>更新版本</h3>
        <div class="settings-helper">拖拽调整顺序；删除版本后，其下待办会移至该游戏的“未分组待办”。</div>
      </div>
    </div>
    <div id="updateManagerList">${rows||'<div class="empty">这个游戏还没有录入任何更新。</div>'}</div>
  `;

  $$('.manage-rename-update').forEach(b=>b.onclick=()=>editUpdate(b.dataset.id));
  $$('.manage-archive-update').forEach(b=>b.onclick=()=>{
    const u=updateById(b.dataset.id);
    const pending=state.items.filter(i=>i.updateId===u.id&&!i.done).length;
    if(!u.archived&&pending&&!confirm(`这一组还有 ${pending} 项未完成，仍然归档吗？`))return;
    u.archived=!u.archived;
    save();
    renderSettings();
    toast(u.archived?'更新已归档':'更新已恢复');
  });
  $$('.manage-delete-update').forEach(b=>b.onclick=()=>deleteUpdateVersion(b.dataset.id));

  let dragId=null;
  $$('.update-manager-row').forEach(row=>{
    row.ondragstart=e=>{
      dragId=row.dataset.updateId;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    };
    row.ondragend=()=>{
      $$('.update-manager-row').forEach(x=>x.classList.remove('dragging','drag-over'));
      dragId=null;
    };
    row.ondragover=e=>{
      e.preventDefault();
      if(row.dataset.updateId!==dragId)row.classList.add('drag-over');
    };
    row.ondragleave=()=>row.classList.remove('drag-over');
    row.ondrop=e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      if(!dragId||dragId===row.dataset.updateId)return;

      const visibleIds=state.updates.filter(u=>u.game===g.id).map(u=>u.id);
      const fromVisible=visibleIds.indexOf(dragId);
      const toVisible=visibleIds.indexOf(row.dataset.updateId);
      if(fromVisible<0||toVisible<0)return;

      const reordered=[...visibleIds];
      const [moved]=reordered.splice(fromVisible,1);
      reordered.splice(toVisible,0,moved);

      let pointer=0;
      state.updates=state.updates.map(u=>{
        if(u.game!==g.id)return u;
        return updateById(reordered[pointer++]);
      });

      save();
      renderSettings();
    };
  });
}

function siteById(game,id){return game?.sites?.find(s=>s.id===id)}
function editSite(gid,siteId=null){
  const g=gameById(gid);
  const site=siteId?siteById(g,siteId):null;
  openModal(`<h3>${site?'编辑网站':'添加网站'}</h3><div class="form-grid"><div class="field full"><label>网站名称</label><input id="siteName" value="${esc(site?.name||'')}"></div><div class="field full"><label>网站 URL</label><input id="siteUrl" value="${esc(site?.url||'')}" placeholder="https://"></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveSite">保存</button></div>`);
  $('#saveSite').onclick=()=>{
    const name=$('#siteName').value.trim();
    const url=$('#siteUrl').value.trim();
    if(!name||!url)return toast('请填写网站名称和 URL');
    try{new URL(url)}catch(e){return toast('请输入有效的 URL，例如 https://example.com')}
    if(site){site.name=name;site.url=url}else{(g.sites||(g.sites=[])).push({id:'site'+Date.now(),name,url})}
    save();closeModal();renderSettings();toast(site?'网站已更新':'网站已添加')
  };
}
function deleteSite(gid,siteId){
  const g=gameById(gid);
  if(!g)return;
  const site=siteById(g,siteId);
  if(!site||!confirm(`确定删除网站“${site.name}”吗？`))return;
  g.sites=g.sites.filter(s=>s.id!==siteId);
  save();renderSettings();toast('网站已删除')
}
function deleteUpdateVersion(id){
  const u=updateById(id);
  if(!u)return;
  const affected=state.items.filter(i=>i.updateId===id).length;
  const message=affected
    ? `确定删除更新“${u.name}”吗？其下 ${affected} 条待办会保留并移动到该游戏的“未分组待办”。`
    : `确定删除更新“${u.name}”吗？`;
  if(!confirm(message))return;
  state.items.forEach(i=>{if(i.updateId===id)i.updateId=''});
  state.updates=state.updates.filter(x=>x.id!==id);
  save();
  renderSettings();
  toast('更新版本已删除');
}
function moveCategory(gid,i,d){let g=gameById(gid),j=i+d;if(j<0||j>=g.categories.length)return;[g.categories[i],g.categories[j]]=[g.categories[j],g.categories[i]];save();renderSettings()}function editCategory(gid,i=null){let g=gameById(gid),old=i===null?'':g.categories[i];openModal(`<h3>${i===null?'添加类别':'重命名类别'}</h3><div class="field"><label>类别名称</label><input id="catName" value="${esc(old)}"></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveCat">保存</button></div>`);$('#saveCat').onclick=()=>{let v=$('#catName').value.trim();if(!v)return;if(i===null){if(!g.categories.includes(v))g.categories.push(v)}else{let prev=g.categories[i];g.categories[i]=v;state.items.filter(x=>x.game===gid&&x.category===prev).forEach(x=>x.category=v)}save();closeModal();renderSettings()}}function deleteCategory(gid,i){let g=gameById(gid),c=g.categories[i],used=state.items.filter(x=>x.game===gid&&x.category===c).length;if(used)return toast(`该类别仍被 ${used} 条待办使用`);g.categories.splice(i,1);save();renderSettings()}
function editTask(id){let t=state.items.find(i=>i.id===id);openModal(`<h3>编辑待办</h3><div class="form-grid"><div class="field"><label>游戏</label><select id="taskGame">${gameOptions(t.game)}</select></div><div class="field"><label>类别</label><select id="taskCategory"></select></div><div class="field full"><label>内容名称</label><input id="taskName" value="${esc(t.name)}"></div><div class="field full"><label>所属更新</label><select id="taskUpdate"></select></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveTaskEdit">保存</button></div>`);function sync(){let gid=$('#taskGame').value;$('#taskCategory').innerHTML=categoryOptions(gid,t.game===gid?t.category:'');$('#taskUpdate').innerHTML=updateOptions(gid,t.game===gid?t.updateId:'')}sync();$('#taskGame').onchange=sync;$('#saveTaskEdit').onclick=()=>{let name=$('#taskName').value.trim();if(!name)return;t.game=$('#taskGame').value;t.category=$('#taskCategory').value;t.updateId=$('#taskUpdate').value;t.name=name;save();closeModal();render()}}
function switchPage(p){currentPage=p;$('#trackerPage').classList.toggle('active',p==='tracker');$('#settingsPage').classList.toggle('active',p==='settings');$('#trackerActions').style.display=p==='tracker'?'flex':'none';$('#settingsBtn').style.display=p==='settings'?'none':'block';$('#trackerBtn').style.display=p==='settings'?'block':'none';$('#subtitle').textContent=p==='tracker'?'你的游戏追踪与常用网站导航。':'管理游戏类别、更新版本和常用网站。';render()}
$('#addGameBtn').onclick=()=>{openModal(`<h3>添加新游戏</h3><div class="form-grid"><div class="field full"><label>游戏名称</label><input id="newGameName"></div><div class="field full"><label>初始类别（每行一个）</label><textarea id="newGameCategories"></textarea></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveGame">添加</button></div>`);$('#saveGame').onclick=()=>{let name=$('#newGameName').value.trim();if(!name)return;let cats=$('#newGameCategories').value.split(/\n/).map(x=>x.trim()).filter(Boolean);let id='g'+Date.now();state.games.push({id,name,categories:cats.length?cats:['其他'],sites:[]});settingsGame=id;save();closeModal();render()}}
$('#addTaskBtn').onclick=()=>{let initial=selectedGame==='all'?state.games[0]?.id:selectedGame;openModal(`<h3>添加待办</h3><div class="form-grid"><div class="field"><label>游戏</label><select id="taskGame">${gameOptions(initial)}</select></div><div class="field"><label>类别</label><select id="taskCategory"></select></div><div class="field full"><label>内容名称</label><input id="taskName"></div><div class="field full"><label>所属更新</label><select id="taskUpdate"></select></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveTask">保存</button></div>`);let sync=()=>{let g=$('#taskGame').value;$('#taskCategory').innerHTML=categoryOptions(g);$('#taskUpdate').innerHTML=updateOptions(g)};sync();$('#taskGame').onchange=sync;$('#saveTask').onclick=()=>{let name=$('#taskName').value.trim();if(!name)return;state.items.push({id:'i'+Date.now(),game:$('#taskGame').value,category:$('#taskCategory').value,updateId:$('#taskUpdate').value,name,done:false});save();closeModal();render()}}
$('#addUpdateBtn').onclick=()=>{let initial=selectedGame==='all'?state.games[0]?.id:selectedGame;openModal(`<h3>录入游戏更新</h3><div class="form-grid"><div class="field"><label>游戏</label><select id="updateGame">${gameOptions(initial)}</select></div><div class="field"><label>实装日期</label><input id="updateDate" type="date"></div><div class="field full"><label>更新名称</label><input id="updateName"></div><div class="field full"><label>批量内容</label><div class="batch-head"><span>类别</span><span>具体名称</span><span></span></div><div id="batchRows"></div><button class="btn small" id="addBatchRow">＋ 添加一行</button></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveUpdate">保存更新</button></div>`);function addRow(cat='',name=''){let row=document.createElement('div');row.className='batch-row';row.innerHTML=`<select class="batch-cat">${categoryOptions($('#updateGame').value,cat)}</select><input class="batch-name" value="${esc(name)}" placeholder="输入具体名称"><button class="btn small danger remove-row">删除</button>`;row.querySelector('.remove-row').onclick=()=>row.remove();$('#batchRows').appendChild(row)}addRow();addRow();$('#addBatchRow').onclick=()=>addRow();$('#updateGame').onchange=()=>$$('.batch-cat').forEach(s=>s.innerHTML=categoryOptions($('#updateGame').value));$('#saveUpdate').onclick=()=>{let rows=$$('.batch-row').map(r=>({category:r.querySelector('.batch-cat').value,name:r.querySelector('.batch-name').value.trim()}));if(rows.some(r=>(r.category&&!r.name)||(!r.category&&r.name)))return toast('请补全未完整的行');rows=rows.filter(r=>r.category&&r.name);if(!rows.length)return toast('请至少添加一项内容');let game=$('#updateGame').value,date=$('#updateDate').value,name=$('#updateName').value.trim()||(date?date+' 更新':'未命名更新'),uid='u'+Date.now();state.updates.push({id:uid,game,name,date,archived:false});rows.forEach((r,i)=>state.items.push({id:'i'+Date.now()+i,game,updateId:uid,category:r.category,name:r.name,done:false}));save();closeModal();render()}}
$('#settingsBtn').onclick=()=>switchPage('settings');$('#trackerBtn').onclick=()=>switchPage('tracker');$('#searchInput').oninput=renderMain;$('#statusFilter').onchange=renderMain;$('#archiveFilter').onchange=renderMain;$('#modalBackdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal()};$('#statusFilter').value='all';render();
</script></body></html>
