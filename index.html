button,input,select,textarea{font-family:inherit;}

.topbar:after{content:"";position:absolute;left:0;right:0;border-bottom:1px solid rgba(255,255,255,.8);}

.brand p{display:none!important;}

.btn,.add-game{letter-spacing:.1px;}

.game-row{display:grid;transition:.12s;}
.game-row.all-game{margin-bottom:5px;}
.game-row.dragging{opacity:.42;}

.game-drag{display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;}
.game-drag:active{cursor:grabbing;}

.iconbtn{font-weight:900;}

.add-game{padding:10px;}

.input,.select,.field input,.field select,.field textarea{border:1px solid #9b968e!important;border-radius:5px!important;background:#fffefb!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);font-weight:650;color:#30302e;}

.section-head h2{text-shadow:0 1px 0 #fff;}

.update-head{box-shadow:inset 0 1px 0 #fff;}

.tasks{background:#f7f5f0;}

.tag{min-width:110px;text-align:center;box-shadow:inset 0 1px 0 #fff;}

.drag{font-size:18px;}

.modal h3{padding-bottom:10px;border-bottom:2px solid #aaa59d;}

html{
  min-width:1180px;
  
}
body{
  min-width:1180px;

}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    linear-gradient(120deg,transparent 0 48%,rgba(255,255,255,.44) 49% 50%,transparent 51%),
    radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.5px);
  background-size:320px 320px,28px 28px;
  mask-image:linear-gradient(to bottom,black,transparent 72%);
}
.app{
  position:relative;
  z-index:1;

}
.topbar{

  border-bottom:1px solid rgba(169,158,162,.56);
}
.topbar:after{
  bottom:-4px;
  border-bottom-color:rgba(255,255,255,.95);
}
.brand h1{

  text-shadow:0 1px 0 white;
}
.actions{gap:9px;}
.btn,.add-game{
  border:1px solid #d0c8ca;
  border-radius:11px;
  color:#4b494f;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(247,241,241,.94));
  box-shadow:0 3px 9px rgba(102,88,92,.1),inset 0 1px 0 white;
  font-weight:700;
}
.btn:hover,.add-game:hover{

  transform:translateY(-1px);
}
.btn:active{
  
  box-shadow:inset 0 2px 5px rgba(100,80,86,.12);
}

.sidebar,.update-card,.settings-shell,.metric,.toolbar,.empty{
  border:1px solid rgba(196,186,188,.72);
  border-radius:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(249,245,245,.87));
  box-shadow:var(--shadow);
  backdrop-filter:none;
}
.sidebar{
  
  top:14px;
}
.side-head{

  letter-spacing:.4px;
}

.game-row{
  grid-template-columns:22px minmax(0,1fr) 34px;
  gap:5px;

}
.game-row.all-game{
  grid-template-columns:minmax(0,1fr);
  border-color:#d6cccf;
}

.game-drag{
  
  font-size:18px;
}

.iconbtn{
  color:#8d868a;
  
}

.count{

  border-radius:999px;
  
}

.add-game{
  border-style:dashed;
  color:#8b8589;
}

.metric:after{
  content:"";
  position:absolute;
  right:-18px;
  top:-26px;
  width:90px;
  height:90px;
  border-radius:50%;
  
}

.metric .value{
  position:relative;
  z-index:1;

}

.input,.select,
.field input,.field select,.field textarea,
.batch-row input,.batch-row select{
  border:1px solid #d9d1d4;
  border-radius:10px;
  color:#4b494f;
  background:rgba(255,255,255,.88);
  box-shadow:inset 0 1px 3px rgba(101,85,90,.05);
}

.update-head{
  position:relative;

}
.update-head:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  
}

.update-actions{gap:7px;}

.settings-shell{
  grid-template-columns:250px minmax(0,1fr);
}

.category-row{
  border-top:1px solid #e5dde0;
  padding:10px 4px;
}
.drag{color:#aba2a7;}

.empty{
  
  padding:50px 20px;
}
.toast{
  border:1px solid rgba(255,255,255,.38);
  border-radius:11px;
  background:rgba(70,66,75,.92);
  box-shadow:0 10px 30px rgba(73,64,69,.2);
}

.game-row{
  align-items:stretch;
}
.game-btn{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  width:100%;
  height:100%;
  
  column-gap:10px;
}
.game-btn span:first-child{
  display:block;
  line-height:1.15;
  transform:translateY(-.5px);
}
.game-row.all-game .game-btn{
  padding-left:12px;
  padding-right:12px;
}
.count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  
  height:22px;
  padding:0 8px;
  line-height:1;
  transform:none;
}
.game-menu{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
}
.iconbtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
}

.btn:hover,.add-game:hover{
  border-color:#9fcee9;
  background:linear-gradient(180deg,#fff,#f2f9ff);
  color:#4c86ab;
}
.btn.primary{

  text-shadow:0 1px 1px rgba(73,126,164,.20);

}
.game-row.drag-over{
  border-color:#9dcdec;
  box-shadow:inset 4px 0 0 #8cc8ef,0 5px 13px rgba(137,193,226,.14);
}
.game-btn.active{

  box-shadow:inset 4px 0 0 #8dcaf1;
}
.game-btn:hover{
  color:#467da3;
  background:#f2f9ff;
}

.metric:after{
  background:radial-gradient(circle,rgba(171,221,252,.30),transparent 69%);
}
.metric:nth-child(2):after{
  background:radial-gradient(circle,rgba(190,231,255,.34),transparent 69%);
}
.metric:nth-child(3):after{
  background:radial-gradient(circle,rgba(210,228,255,.26),transparent 69%);
}
.input:focus,.select:focus,
.field input:focus,.field select:focus,.field textarea:focus,
.batch-row input:focus,.batch-row select:focus{
  outline:2px solid rgba(147,205,244,.26);
  border-color:#8fc9ef;
}

.update-head:before{
  background:linear-gradient(#a8d9f8,#81c3eb);
}

/* Final task row order: checkbox → category → content */
.task{
  grid-template-columns:auto 116px minmax(0,1fr) 28px 28px !important;
  column-gap:12px;
}
.task .tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:116px;
  min-width:116px;
  margin:0;
}
.task .task-name{
  min-width:0;
  line-height:1.35;
}

/* Unified update-version management */
.settings-update-manager{
  margin-bottom:8px;
}
.settings-nav-divider{
  height:1px;
  margin:10px 2px;
  background:linear-gradient(90deg,transparent,#d7e3ec 12%,#d7e3ec 88%,transparent);
}
#updateManagerList{
  display:grid;
  gap:9px;
}
.update-manager-row{
  display:grid;
  grid-template-columns:24px minmax(0,1fr) 72px auto auto auto;
  gap:10px;
  align-items:center;
  min-height:62px;
  padding:9px 10px;
  border:1px solid #d8e5ee;

}
.update-manager-row.is-archived{
  opacity:.66;
  background:linear-gradient(180deg,rgba(250,252,254,.96),rgba(240,244,247,.9));
}
.update-manager-row.dragging{
  opacity:.42;
}

.update-manager-drag{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9aaab5;
  cursor:grab;
  user-select:none;
}
.update-manager-drag:active{
  cursor:grabbing;
}
.update-manager-info{
  min-width:0;
}
.update-manager-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

}
.update-manager-meta{
  margin-top:4px;

}
.update-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:66px;
  height:25px;
  
  border:1px solid #d6e4ed;

}

.update-status.archived{
  color:#888f95;
  background:#f1f3f5;
}

/* Two-level settings structure */

.settings-tabs{
  display:flex;
  
  margin:4px 0 18px;

}

.settings-tab:hover{
  border-color:#9fcfeb;

}

.settings-panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

}
.settings-panel-head h3{
  margin:0;

}
.settings-helper{
  margin-top:4px;

}

/* Game Dashboard quick links */
.tracker-shell{
  display:grid;
  grid-template-columns:minmax(0,1fr) 248px;
  gap:16px;
  align-items:start;
}
.tracker-main{min-width:0;}
.quicklinks-panel{
  
  top:14px;
  display:grid;
  gap:10px;

}
.quicklinks-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:10px;
  
}
.quicklinks-head h3{margin:0;}
.quicklinks-sub{margin-top:3px;}
.quicklinks-list{display:grid;}
.quicklink-item{
  display:grid;
  
  align-items:center;
  gap:10px;

  text-decoration:none;
  
}

.quicklink-icon{

  object-fit:contain;
  
}
.quicklink-name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  
}
.quicklink-arrow{font-size:12px;}
.quicklinks-empty{
  padding:18px 12px;
  border:1px dashed #d6e4ed;
  border-radius:12px;
  
  text-align:center;
  
}
.quicklinks-empty button{margin-top:10px;}
.site-row{
  display:grid;
  grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) auto auto auto;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid var(--line);
}
.site-url{
  color:#81909a;
  
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.settings-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  
}
.settings-actions{
  display:flex;
  
  flex-wrap:wrap;
}

/* Performance pass */

.game-btn .count,
.section-pending-count{
  font-variant-numeric:tabular-nums;
}

/* Smooth scrolling / low-paint-cost pass */
body{
  background-attachment:scroll !important;
}
body::before{
  display:none !important;
}

/* Backdrop blur is expensive on long scrolling pages. Keep the same soft surfaces
   with opaque/semi-opaque fills instead. */
.sidebar,
.update-card,
.settings-shell,
.metric,
.toolbar,
.empty{
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
.sidebar,
.settings-shell,
.metric,
.toolbar,
.empty{
  background:linear-gradient(145deg,#ffffff,#f6faff) !important;
  box-shadow:0 2px 7px rgba(80,125,155,.07) !important;
}
.update-card{

  content-visibility:auto;
  contain-intrinsic-size:auto 260px;
}

/* Avoid making every task row its own paint-containment region. */
.task{
  contain:none !important;
}

/* Modal opening should not blur/repaint the whole page behind it. */
.modal-backdrop{
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  
}

/* Keep button feedback, but avoid transform/compositor churn. */
.btn:hover,
.add-game:hover{
  transform:none !important;
}
.btn:active{
  transform:none !important;
}

/* Sidebar/navigation cards don't need a blurred/deep shadow per row. */

/* Decorative metric glow is subtle but forces extra painting during scroll. */

/* Keep scrolling compositing simple. */
.sidebar,
.quicklinks-panel{
  will-change:auto;
}

/* =========================================================
   Blue Archive-inspired preview skin
   Visual-only layer: no data / behavior changes
   ========================================================= */

:root{
  --bg:#eef7fc !important;
  --panel:#ffffff !important;
  --text:#24384c !important;
  --muted:#7690a4 !important;
  --line:#d3e6f1 !important;
  --primary:#22aeea !important;
  --soft:#e8f7ff !important;
  --danger:#e56778 !important;
  --shadow:0 4px 12px rgba(47,103,137,.08) !important;
  --r:10px !important;
}

html{
  background:#eef7fc;
}

body{
  background:
    linear-gradient(135deg,rgba(44,178,232,.055) 0 1px,transparent 1px 92px),
    linear-gradient(45deg,rgba(57,121,165,.035) 0 1px,transparent 1px 128px),
    #eef7fc !important;
  color:#24384c !important;
}

.app{
  max-width:1450px !important;
  padding:22px 26px 52px !important;
}

/* ---------- Header ---------- */
.topbar{
  position:relative;
  margin-bottom:16px !important;
  
  border:1px solid #cfe5f2;
  border-left:5px solid #24b8f2;
  border-radius:7px;
  background:#fff;
  box-shadow:0 3px 9px rgba(45,105,145,.06);
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute;
  right:-34px;
  top:-42px;
  width:180px;
  height:96px;
  border:2px solid rgba(37,178,234,.16);
  transform:skewX(-28deg);
  pointer-events:none;
}
.brand h1{
  position:relative;
  z-index:1;
  color:#21394e;

}
.brand h1::after{
  content:" // PERSONAL NAVIGATION";
  margin-left:10px;

  font-weight:800;
  
  vertical-align:middle;
}
.brand p{
  position:relative;
  z-index:1;
  margin-top:3px !important;
  color:#7991a4 !important;
  
}

/* ---------- Buttons ---------- */
.btn,
.add-game{
  border:1px solid #c9dfeb !important;
  border-radius:6px !important;
  background:#fff !important;
  color:#4c6b80 !important;
  box-shadow:none !important;
  font-weight:750 !important;
  transition:background .12s ease,border-color .12s ease,color .12s ease !important;
}
.btn:hover,
.add-game:hover{
  border-color:#55bfe9 !important;
  background:#eefaff !important;
  color:#168ac2 !important;
}
.btn.primary{
  border-color:#27abe4 !important;
  background:linear-gradient(135deg,#36bff3,#1f9fdc) !important;
  color:#fff !important;
  box-shadow:0 2px 6px rgba(30,150,207,.18) !important;
}
.btn.danger{
  color:#d65367 !important;
}
.iconbtn{
  border-radius:5px !important;
}
.iconbtn:hover{
  background:#e8f7ff !important;
  color:#168fc7 !important;
}

/* ---------- Main 3-column structure ---------- */
.layout{
  grid-template-columns:274px minmax(0,1fr) !important;
  gap:14px !important;
}

/* ---------- Sidebar ---------- */
.sidebar{
  padding:12px !important;
  border:1px solid #cde2ee;
  border-radius:8px !important;
  background:#fdfefe !important;
  box-shadow:0 4px 11px rgba(44,102,137,.065) !important;
}
.side-head{
  position:relative;

  for(const item of loaded)if(!seen.has(item.id)){state.items.push(item);seen.add(item.id)}
  state.items.sort((a,b)=>(a.sortIndex??0)-(b.sortIndex??0));
  pending.forEach(u=>loadedArchivedUpdateIds.add(u.id));
  indexCache=null;
  resetSnapshot();
}

async function toggleUpdateArchive(id){
  const u=updateById(id);if(!u)return;
  const target=!u.archived;
  if(target&&u.pendingCount&&!confirm(`这一组还有 ${u.pendingCount} 项未完成，仍然归档吗？`))return;
  try{
    await writeQueue;
    const tx=db.transaction(['updates','items'],'readwrite');
    const done=transactionDone(tx);
    const itemsStore=tx.objectStore('items');
    const req=itemsStore.index('by_update').getAll(id);
    req.onsuccess=()=>{
      for(const i of req.result){i.bucket=target?'archived':'active';itemsStore.put(i)}
      tx.objectStore('updates').put({...u,archived:target});
    };
    await done;
    u.archived=target;
    await reloadActiveFromDatabase();
    archiveVisibleLimit=8;
    render();toast(target?'更新已归档':'更新已恢复');
  }catch(err){storageError(err)}
}
async function deleteUpdateVersion(id){
  const u=updateById(id);if(!u)return;
  const affected=u.taskCount||0;
  const message=affected?`确定删除更新“${u.name}”吗？其下 ${affected} 条待办会保留并移动到该游戏的“未分组待办”。`:`确定删除更新“${u.name}”吗？`;
  if(!confirm(message))return;
  try{
    await writeQueue;
    const tx=db.transaction(['updates','items'],'readwrite');
    const done=transactionDone(tx);
    const itemsStore=tx.objectStore('items');
    const req=itemsStore.index('by_update').getAll(id);
    req.onsuccess=()=>{
      for(const i of req.result){i.updateId='';i.bucket='active';itemsStore.put(i)}
      tx.objectStore('updates').delete(id);
    };
    await done;
    await reloadActiveFromDatabase();
    render();toast('更新版本已删除');
  }catch(err){storageError(err)}
}
function getIndex(){
  if(indexCache)return indexCache;
  const gamesById=new Map(state.games.map(g=>[g.id,g]));
  const updatesById=new Map();
  const updatesByGame=new Map(state.games.map(g=>[g.id,[]]));
  for(const u of state.updates){
    updatesById.set(u.id,u);
    if(!updatesByGame.has(u.game))updatesByGame.set(u.game,[]);
    updatesByGame.get(u.game).push(u);
  }
  const itemsById=new Map();
  const itemsByGame=new Map(state.games.map(g=>[g.id,[]]));
  const pendingByGame=new Map(state.games.map(g=>[g.id,0]));
  const categoryOrderByGame=new Map();
  state.games.forEach(g=>categoryOrderByGame.set(g.id,new Map((g.categories||[]).map((c,i)=>[c,i]))));
  for(const item of state.items){
    itemsById.set(item.id,item);
    if(!itemsByGame.has(item.game))itemsByGame.set(item.game,[]);
    itemsByGame.get(item.game).push(item);
    if(item.bucket!=='archived'&&!item.done)pendingByGame.set(item.game,(pendingByGame.get(item.game)||0)+1);
  }
  indexCache={gamesById,updatesById,updatesByGame,itemsById,itemsByGame,pendingByGame,categoryOrderByGame};
  return indexCache;
}

function siteFallbackIcon(){
  return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#BDE7FF"/><path d="M18 21h28M18 32h28M18 43h18" stroke="#F8FCFF" stroke-width="5" stroke-linecap="round"/></svg>');
}
function siteFaviconCandidates(url){
  try{
    const u=new URL(url);
    const host=u.hostname;
    return [
      `${u.protocol}//${host}/favicon.ico`,
      `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(u.origin)}&sz=64`,
      `https://icons.duckduckgo.com/ip3/${encodeURIComponent(host)}.ico`,
      siteFallbackIcon()
    ];
  }catch(e){
    return [siteFallbackIcon()];
  }
}
function faviconAttrs(url){
  const candidates=siteFaviconCandidates(url);
  return `src="${esc(candidates[0])}" data-favicon-index="0" data-favicon-candidates="${esc(JSON.stringify(candidates))}"`;
}
function handleFaviconError(img){
  let candidates=[];
  try{candidates=JSON.parse(img.dataset.faviconCandidates||'[]')}catch(e){}
  let next=(Number(img.dataset.faviconIndex)||0)+1;
  if(next>=candidates.length){
    img.onerror=null;
    img.src=siteFallbackIcon();
    return;
  }
  img.dataset.faviconIndex=String(next);
  img.src=candidates[next];
}

    nomatch:['⌕','没有找到匹配的内容','试试其他关键词，或者清除筛选条件。'],
    archivedempty:['▤','没有 Archived 记录','这个游戏目前还没有已归档的更新版本。'],
    noarchiveitems:['▤','暂时没有可显示的归档任务','可以继续加载历史版本，或切换到 Active 查看当前待办。'],
    loading:['··','正在读取 Archived','历史记录按需加载，请稍候。'],

    loaderror:['!','历史记录读取失败','当前数据不会被清除，请重试；如果反复失败，先导出 JSON 备份。'],
    initerror:['!','本地数据库暂时不可用','请检查浏览器的存储权限或隐私模式；原始数据不会被主动清除。'],
    nocategories:['＋','还没有类别','点击上方“添加类别”建立第一项。'],

    nosites:['↗','还没有常用网站','点击上方“添加网站”建立当前游戏的快捷导航。']
  };
  const [icon,title,detail]=messages[type]||messages.nomatch;
  const action=type==='nomatch'?'<button class="btn small" data-action="clear-filters">清除筛选</button>':
    type==='loaderror'?'<button class="btn small primary" data-action="retry-archives">重新加载</button>':

function getMainViewData(){
  const idx=getIndex();
  const st=$('#statusFilter').value;
  const ar=$('#archiveFilter').value;
  const q=$('#searchInput').value.trim().toLowerCase();
  const scopeItems=selectedGame==='all'
    ? state.items
    : (idx.itemsByGame.get(selectedGame)||[]);

  const grouped=new Map();

  for(const item of scopeItems){
    const u=item.updateId?idx.updatesById.get(item.updateId):null;
    const archived=!!u?.archived;
    if(st!=='all' && (st==='done'?!item.done:item.done))continue;
    if(ar!=='all' && (ar==='archived'?!archived:archived))continue;
    if(q && !(item.name+' '+item.category).toLowerCase().includes(q))continue;

    let gameMap=grouped.get(item.game);
    if(!gameMap){gameMap=new Map();grouped.set(item.game,gameMap)}
    const uid=item.updateId||'';
    let bucket=gameMap.get(uid);
    if(!bucket){bucket=[];gameMap.set(uid,bucket)}
    bucket.push(item);
  }

  const all=fullStats(selectedGame);
  return {idx,total:all.total,done:all.done,pending:all.pending,grouped};
}

function renderMain(){
  const {idx,total,done,pending,grouped}=getMainViewData();
  $('#pendingCount').textContent=pending;
  let activeUpdates=0;
  for(const u of state.updates){
    if(!u.archived&&(selectedGame==='all'||u.game===selectedGame))activeUpdates++;
  }
  $('#updateCount').textContent=activeUpdates;
  $('#completionRate').textContent=total?Math.round(done/total*100)+'%':'0%';

  if(!grouped.size){
    const query=$('#searchInput').value.trim(),status=$('#statusFilter').value,archive=$('#archiveFilter').value;
    const archivedCount=state.updates.filter(u=>u.archived&&(selectedGame==='all'||u.game===selectedGame)).length;
    const stateType=query||status!=='all'?'nomatch':archive==='archived'&&archivedCount===0?'archivedempty':archive!=='active'?'noarchiveitems':!state.items.some(i=>i.bucket!=='archived'&&(selectedGame==='all'||i.game===selectedGame))?'noitems':'nomatch';
    $('#mainContent').innerHTML=stateMessage(stateType)+archiveMoreMarkup();
    return;
  }

  let html='';
  for(const g of state.games){
    const gameMap=grouped.get(g.id);
    if(!gameMap||!gameMap.size)continue;

    let visiblePending=0;
    for(const tasks of gameMap.values()){
      for(const t of tasks)if(!t.done)visiblePending++;
    }

    html+=`<section class="section" data-game-section="${g.id}"><div class="section-head"><h2>${esc(g.name)}</h2><small><span class="section-pending-count">${visiblePending}</span> 项未完成</small></div>`;

    const categoryOrder=idx.categoryOrderByGame.get(g.id)||new Map();
    const updateIds=(idx.updatesByGame.get(g.id)||[]).map(u=>u.id);
    updateIds.push('');

    for(const uid of updateIds){
      const tasks=gameMap.get(uid);
      if(!tasks?.length)continue;

      tasks.sort((a,b)=>{
        const ai=categoryOrder.has(a.category)?categoryOrder.get(a.category):categoryOrder.size;
        const bi=categoryOrder.has(b.category)?categoryOrder.get(b.category):categoryOrder.size;
        return ai-bi;
      });

      const u=uid?idx.updatesById.get(uid):null;
      html+=`<div class="update-card ${u?.archived?'archived':''}" data-update-card="${uid||'ungrouped'}"><div class="update-head"><div><div class="update-title">${esc(u?.name||'未分组待办')}</div>${u?`<div class="update-meta">${esc(u.date||'无日期')} · ${u.archived?'Archived':'Active'}</div>`:''}</div><div class="update-actions">${u?`<button class="btn small rename-update" data-id="${u.id}">重命名</button><button class="btn small archive-update" data-id="${u.id}">${u.archived?'恢复':'Archive'}</button>`:''}</div></div><div class="tasks">${tasks.map(i=>`<div class="task ${i.done?'done':''}" data-task-id="${i.id}"><input class="task-check" type="checkbox" data-id="${i.id}" ${i.done?'checked':''}><span class="tag">${esc(i.category)}</span><span class="task-name">${esc(i.name)}</span><button class="iconbtn edit-task" data-id="${i.id}" title="编辑">✎</button><button class="iconbtn delete-task" data-id="${i.id}" title="删除">🗑</button></div>`).join('')}</div></div>`;
    }

  }
  $('#mainContent').innerHTML=html+archiveMoreMarkup();
}

  $$('.manage-delete-update').forEach(b=>b.onclick=()=>deleteUpdateVersion(b.dataset.id));

  let dragId=null;
  $$('.update-manager-row').forEach(row=>{
    row.ondragstart=e=>{
      dragId=row.dataset.updateId;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    };
    row.ondragend=()=>{
      $$('.update-manager-row').forEach(x=>x.classList.remove('dragging','drag-over'));
      dragId=null;
    };
    row.ondragover=e=>{
      e.preventDefault();
      if(row.dataset.updateId!==dragId)row.classList.add('drag-over');
    };
    row.ondragleave=()=>row.classList.remove('drag-over');
    row.ondrop=e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      if(!dragId||dragId===row.dataset.updateId)return;

      const visibleIds=state.updates.filter(u=>u.game===g.id).map(u=>u.id);
      const fromVisible=visibleIds.indexOf(dragId);
      const toVisible=visibleIds.indexOf(row.dataset.updateId);
      if(fromVisible<0||toVisible<0)return;

      const reordered=[...visibleIds];
      const [moved]=reordered.splice(fromVisible,1);
      reordered.splice(toVisible,0,moved);

      let pointer=0;
      state.updates=state.updates.map(u=>{
        if(u.game!==g.id)return u;
        return updateById(reordered[pointer++]);
      });

      save();
      renderSettings();
    };
  });
}

function deleteSite(gid,siteId){

function moveCategory(gid,i,d){
  const g=gameById(gid),j=i+d;
  if(!g||j<0||j>=g.categories.length)return;
  [g.categories[i],g.categories[j]]=[g.categories[j],g.categories[i]];
  save();renderSettings();
}
function editCategory(gid,i=null){
  const g=gameById(gid),old=i===null?'':g.categories[i];
  openModal(`<h3>${i===null?'添加类别':'重命名类别'}</h3><div class="field"><label>类别名称</label><input id="catName" value="${esc(old)}"></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveCat">保存</button></div>`);
  $('#saveCat').onclick=async()=>{
    const v=$('#catName').value.trim();if(!v)return;
    if(g.categories.includes(v)&&v!==old)return toast('类别名称已存在');
    if(i===null){g.categories.push(v);save();closeModal();renderSettings();return}
    if(v===old){closeModal();return}
    try{
      await writeQueue;
      const tx=db.transaction(['games','items'],'readwrite');
      const done=transactionDone(tx);
      const store=tx.objectStore('items');
      const req=store.index('by_game').getAll(gid);
      req.onsuccess=()=>{for(const t of req.result)if(t.category===old){t.category=v;store.put(t)}};
      const revised={...g,categories:g.categories.map(x=>x===old?v:x)};
      tx.objectStore('games').put(revised);
      await done;
      await reloadActiveFromDatabase();
      closeModal();render();toast('类别已重命名（包含 Archived）');
    }catch(err){storageError(err)}
  };
}
async function deleteCategory(gid,i){
  const g=gameById(gid),c=g?.categories?.[i];if(!c)return;
  try{
    await writeQueue;
    const tx=db.transaction('items','readonly');
    const done=transactionDone(tx);
    const records=await requestResult(tx.objectStore('items').index('by_game').getAll(gid));
    await done;
    const used=records.filter(item=>item.category===c).length;
    if(used)return toast(`该类别仍被 ${used} 条待办使用（包括 Archived）`);
    g.categories.splice(i,1);save();renderSettings();
  }catch(err){storageError(err)}
}
function editTask(id){let t=state.items.find(i=>i.id===id);openModal(`<h3>编辑待办</h3><div class="form-grid"><div class="field"><label>游戏</label><select id="taskGame">${gameOptions(t.game)}</select></div><div class="field"><label>类别</label><select id="taskCategory"></select></div><div class="field full"><label>内容名称</label><input id="taskName" value="${esc(t.name)}"></div><div class="field full"><label>所属更新</label><select id="taskUpdate"></select></div></div><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveTaskEdit">保存</button></div>`);function sync(){let gid=$('#taskGame').value;$('#taskCategory').innerHTML=categoryOptions(gid,t.game===gid?t.category:'');$('#taskUpdate').innerHTML=updateOptions(gid,t.game===gid?t.updateId:'')}sync();$('#taskGame').onchange=sync;$('#saveTaskEdit').onclick=()=>{let name=$('#taskName').value.trim();if(!name)return;t.game=$('#taskGame').value;t.category=$('#taskCategory').value;t.updateId=$('#taskUpdate').value;t.name=name;save();closeModal();render()}}

function normalizeImportedState(raw){
  const now=Date.now();
  const games=(Array.isArray(raw?.games)?raw.games:[]).map((g,idx)=>({
    id:String(g?.id||`g${now}${idx}`),
    name:String(g?.name||'未命名游戏'),
    categories:(Array.isArray(g?.categories)&&g.categories.length?g.categories:['其他']).map(x=>String(x)),
    sites:(Array.isArray(g?.sites)?g.sites:[]).map((s,j)=>({
      id:String(s?.id||`site${now}${idx}${j}`),
      name:String(s?.name||'未命名网站'),
      url:String(s?.url||'')
    })).filter(s=>s.name&&s.url)
  }));
  if(!games.length)throw new Error('导入文件中没有有效的游戏数据');
  const gameIds=new Set(games.map(g=>g.id));
  const updates=(Array.isArray(raw?.updates)?raw.updates:[]).filter(u=>gameIds.has(u?.game)).map((u,idx)=>({
    id:String(u?.id||`u${now}${idx}`),
    game:String(u.game),
    name:String(u?.name||'未命名更新'),
    date:String(u?.date||''),
    archived:!!u?.archived
  }));
  const updateIds=new Set(updates.map(u=>u.id));
  const items=(Array.isArray(raw?.items)?raw.items:[]).filter(i=>gameIds.has(i?.game)).map((i,idx)=>({
    id:String(i?.id||`i${now}${idx}`),
    game:String(i.game),
    updateId:updateIds.has(i?.updateId)?String(i.updateId):'',
    category:String(i?.category||'其他'),
    name:String(i?.name||'未命名待办'),
    done:!!i?.done
  }));
  return {games,updates,items};
}
async function exportData(){
  try{
    await writeQueue;
    const tx=db.transaction(['games','updates','items'],'readonly');
    const done=transactionDone(tx);
    const gp=requestResult(tx.objectStore('games').getAll());
    const up=requestResult(tx.objectStore('updates').getAll());
    const it=requestResult(tx.objectStore('items').getAll());
    const [games,updates,items]=await Promise.all([gp,up,it]);
    await done;
    const payload={exportedAt:new Date().toISOString(),app:'Game Dashboard',version:1,data:{
      games:games.sort((a,b)=>(a.sortIndex??0)-(b.sortIndex??0)).map(({id,name,categories,sites})=>({id,name,categories,sites})),
      updates:updates.sort((a,b)=>(a.sortIndex??0)-(b.sortIndex??0)).map(({id,game,name,date,archived})=>({id,game,name,date,archived})),
      items:items.sort((a,b)=>(a.sortIndex??0)-(b.sortIndex??0)).map(({id,game,updateId,category,name,done})=>({id,game,updateId,category,name,done}))
    }};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href=url;a.download=`game-dashboard-backup-${stamp}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
    toast(`已导出 ${items.length} 条待办（包含归档）`);
  }catch(err){storageError(err);alert('导出失败，请检查浏览器存储状态。')}
}
async function handleImportData(file){
  if(!file)return;
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    const incoming=parsed?.data??parsed;
    const records=buildRecords(incoming);
    if(!confirm(`导入会覆盖当前网页的全部数据。文件包含 ${records.games.length} 个游戏、${records.updates.length} 个更新和 ${records.items.length} 条待办。建议先导出当前数据备份。确定覆盖吗？`))return;
    await writeQueue;
    await replaceDatabaseContents(records);
    selectedGame='all';settingsSection='categories';archiveVisibleLimit=8;
    await reloadActiveFromDatabase();
    $('#archiveFilter').value='active';$('#statusFilter').value='all';
    render();toast('导入成功（包含归档记录）');
  }catch(err){console.error(err);alert('导入失败：文件格式无效或写入数据库失败，原有数据可能未被修改，请核对当前页面。')}
  finally{$('#importDataInput').value=''}
}
